<script>
    const BRIDGE_URL = "http://localhost:5000";

    async function fetchPorts() {
        const portSelect = document.getElementById('portSelect');
        try {
            let response = await fetch(BRIDGE_URL + '/ports');
            if (!response.ok) throw new Error('Bridge meldet Fehler');
            
            let ports = await response.json();
            let currentVal = portSelect.value;
            
            portSelect.innerHTML = ''; // Leeren
            
            if (ports.length === 0) {
                portSelect.innerHTML = '<option value="">Kein Port gefunden</option>';
            } else {
                ports.forEach(port => {
                    let opt = document.createElement('option');
                    opt.value = port;
                    opt.text = port;
                    if (port === currentVal) opt.selected = true; // Vorherige Auswahl behalten
                    portSelect.appendChild(opt);
                });
            }
        } catch (error) {
            console.warn("Lokale Bridge nicht erreichbar.");
            portSelect.innerHTML = '<option value="">Bridge offline</option>';
        }
    }

   
    async function uploadToArduino() {
        const port = document.getElementById('portSelect').value;
        const board = document.getElementById('boardSelect').value;
        const btn = document.getElementById('uploadBtn');
        
    
        let code = document.getElementById('codeExport').innerText;
        
        if (!code || code.trim() === "" || code.includes("// Lade Blöcke...")) {
            alert("Es gibt keinen generierten Code zum Hochladen!");
            return;
        }

        
        if (!port || port === "Bridge offline") {
            let userWantsHelp = confirm("Keine Verbindung zur LogikKiste-Bridge!\n\nDamit du den Code direkt aus dem Browser hochladen kannst, muss die Arduino IDE im Hintergrund laufen. \n\nMöchtest du dir die Anleitung dazu auf meiner Hompage anschauen?");           
            if (userWantsHelp) {
                window.open("https://www.kreativekiste.de/handbuch-blockly", "_blank");
            }
            return;
        }

       
        btn.disabled = true;
        btn.innerText = "⏳ Lade hoch...";

        try {
            let response = await fetch(BRIDGE_URL + '/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, port: port, board: board })
            });
            
            let resultText = await response.text();
            
            if (response.ok) {
                alert("Upload erfolgreich!\n\n" + resultText);
            } else {
                alert("Fehler beim Upload:\n\n" + resultText);
            }
        } catch (error) {
            let userWantsHelp = confirm("Die Verbindung zur lokalen Bridge ist abgerissen!\nLäuft die 'start_bridge.bat' noch?\n\nMöchtest du zur Anleitung wechseln?");
            if (userWantsHelp) {
                window.open("https://www.kreativekiste.de/handbuch-blockly", "_blank");
            }
        } finally {
     
            btn.disabled = false;
            btn.innerText = "🚀 Upload";
        }
    }
</script>
