<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Arduino R4_LogicKiste</title>
    
    <!-- Externe Libraries -->
    <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
    
    <!-- CSS einbinden -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="title">Arduino R4_LogicKiste</div>
    
    <!-- UI Controls -->
    <div class="header-controls">
        <button class="btn btn-action" onclick="workspace.undo(false)" title="Rückgängig">↩ Zurück</button>
        <button class="btn btn-action" onclick="workspace.undo(true)" title="Wiederherstellen">↪ Vor</button>
        <div style="width: 10px;"></div> 

        <button class="btn btn-ui" onclick="toggleGrid()">🕸️ Raster Ein/Aus</button>
        <button class="btn btn-ui" onclick="toggleCode()">💻 Code Ein/Aus</button>
        <div style="width: 20px;"></div> 
        
        <button class="btn" onclick="saveWorkspace()">💾 Speichern</button>
        <label class="btn btn-load" for="fileInput">📂 Laden</label>
        <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="loadWorkspace(event)">
        <div style="width: 20px;"></div>

        <!-- NEU: Copy Button -->
        <button class="btn btn-ui" id="copyBtn" onclick="copyGeneratedCode()">📋 Code kopieren</button>
        
        <button class="btn btn-upload" id="uploadBtn" onclick="uploadCode()">⬆️ Upload</button>
        <span id="uploadStatus" style="font-size:0.85em; color:#bdc3c7;"></span>
    </div>

    <div style="font-size: 0.9em; color: #bdc3c7;" id="codeHeader">C++ Export</div>
</header>

<div id="main">
    <div id="blocklyDiv"></div>
    <div id="codeExport">// Lade Blöcke...</div>
</div>

<!-- ========================================== -->
<!-- TOOLBOX (XML-Menü für Blockly)             -->
<!-- ========================================== -->
<!-- HINWEIS: Wenn du dein Menü in der app.js aus JS/JSON aufbaust, -->
<!-- kannst du diesen Bereich einfach als Kopiervorlage für die   -->
<!-- Block-Namen nutzen und hier löschen!                         -->
<xml id="toolbox" style="display: none">
    
    <!-- Hier kommen deine ganzen bisherigen Kategorien (Board, Input, etc.) rein -->

    <category name="Visuals" colour="45">
        <!-- Hier deine alten Visuals rein (LCD, Matrix etc.) -->
        
        <!-- NEU: TM Displays -->
        <block type="ard_visu_tm1637_setup"></block>
        <block type="ard_visu_tm1637_print"></block>
        <block type="ard_visu_tm1638_setup"></block>
        <block type="ard_visu_tm1638_print"></block>
        <block type="ard_visu_tm1638_led"></block>
        <block type="ard_visu_tm1638_button"></block>
    </category>

    <category name="Erweitert" colour="160">
        <!-- Serial Kommunikation -->
        <block type="ard_serial_begin"></block>
        <block type="ard_serial_print"></block>
        <block type="ard_serial_available"></block>
        <block type="ard_serial_read_string"></block>
        <!-- R4 EEPROM / Flash -->
        <block type="ard_eeprom_write"></block>
        <block type="ard_eeprom_read"></block>
        <!-- SD Karte -->
        <block type="ard_sd_begin"></block>
        <block type="ard_sd_write"></block>
        <block type="ard_sd_exists"></block>
        <block type="ard_sd_remove"></block>
        <!-- RFID Modul -->
        <block type="ard_rfid_setup"></block>
        <block type="ard_rfid_on_card"></block>
        <block type="ard_rfid_get_id"></block>
        <!-- C++ Notausgang -->
        <block type="ard_custom_code_inline"></block>
        <block type="ard_custom_code_global"></block>
    </category>
</xml>

<!-- ========================================== -->
<!-- DEINE MODULE LADEN                         -->
<!-- ========================================== -->

<!-- Generator Kern (Gehirn) -->
<script src="js/generator_core.js"></script>

<!-- Board -->
<script src="blocks/board/interrupts.js"></script>
<script src="blocks/board/variables_basic.js"></script>

<!-- Input -->
<script src="blocks/input/setup_pullup.js"></script>
<script src="blocks/input/read_digital.js"></script>
<script src="blocks/input/read_analog.js"></script>
<script src="blocks/input/input_counter.js"></script>
<script src="blocks/input/input_encoder.js"></script>
<!-- HINWEIS: serial_read.js wurde hier entfernt -->

<!-- Sensor -->
<script src="blocks/sensor/dht_sensor.js"></script>
<script src="blocks/sensor/ultrasonic_hc_sr04.js"></script>

<!-- Output -->
<script src="blocks/output/write_digital.js"></script>
<script src="blocks/output/write_analog.js"></script>
<!-- HINWEIS: serial_monitor.js wurde hier entfernt -->

<!-- Motor -->
<script src="blocks/motor/motors.js"></script>
<script src="blocks/motor/stepper_advanced.js"></script>

<!-- Visuals -->
<script src="blocks/visuals/max7219_matrix.js"></script>
<script src="blocks/visuals/lcd_i2c.js"></script>
<script src="blocks/visuals/tft_displays.js"></script>
<script src="blocks/visuals/neopixel_basic.js"></script>
<script src="blocks/visuals/visu_tm.js"></script> <!-- NEU HINZUGEFÜGT -->

<!-- Time -->
<script src="blocks/time/delay.js"></script>
<script src="blocks/time/timer_interval.js"></script>
<script src="blocks/time/time_system.js"></script>
<script src="blocks/time/stopwatch.js"></script>

<!-- Functions -->
<script src="blocks/functions/logic_if.js"></script>
<script src="blocks/functions/logic_compare.js"></script>
<script src="blocks/functions/loop_repeat.js"></script>
<script src="blocks/functions/loop_while.js"></script>
<script src="blocks/functions/blinker.js"></script>
<script src="blocks/functions/state_machine.js"></script>
<script src="blocks/functions/logic_basic.js"></script>
<script src="blocks/functions/math_basic.js"></script>
<script src="blocks/functions/math_advanced.js"></script>
<script src="blocks/functions/math_random.js"></script>
<script src="blocks/functions/functions_custom.js"></script>

<!-- ========================================== -->
<!-- ADVANCED (ERWEITERT) - NEUER ORDNER        -->
<!-- ========================================== -->
<script src="blocks/advanced/serial_com.js"></script>
<script src="blocks/advanced/custom_cpp.js"></script>
<script src="blocks/advanced/eeprom_r4.js"></script>
<script src="blocks/advanced/sd_card.js"></script>
<script src="blocks/advanced/rfid_rc522.js"></script>

<!-- App Logik (Start) -->
<script src="js/app.js"></script>

</body>
</html>
