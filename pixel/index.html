<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOT Matrix Designer | LogicKiste</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./pixel.css">
</head>
<body>

<header>
    <nav>
        <ul class="block-menu">
            <li>
                <a href="../index.html" class="menu-block block-green">
                    Gehe zu <span class="value-field">"Startseite"</span>
                </a>
            </li>
            <li>
                <a href="#" class="menu-block block-blue">
                    Designe <span class="value-field">"DOT Matrix"</span>
                </a>
            </li>
            <li>
                <a href="../neo/index.html" class="menu-block block-orange">
                    Designe <span class="value-field">"NeoPixel"</span>
                </a>
            </li>
        </ul>
    </nav>
	
</header>

<div class="main-container">
    <aside class="controls">
        <div class="control-group">
            <h3>Module hinzufügen</h3>
            <p style="font-size: 0.8em; color: #666; margin-bottom: 10px;">Maximal 16 Einheiten (8x8) möglich.</p>
            <button id="btnAddSingle" class="btn-add" onclick="spawnModule('8x8')">+ 8x8 Matrix</button>
            <button id="btnAddQuad" class="btn-add" onclick="spawnModule('32x8')">+ 4-in-1 (32x8)</button>
        </div>

        <div class="control-group">
            <h3>Wartebereich</h3>
            <p style="font-size: 0.75em; color: #d9534f; margin-bottom: 5px;">Ziehe das Modul von hier auf die graue Fläche.</p>
            <div id="spawn-area" class="spawn-container">
                </div>
        </div>

        <div class="control-group">
            <button class="btn-clear" onclick="clearCanvas()">Alles löschen</button>
        </div>
    </aside>

    <main class="editor-area">
        <div class="canvas-wrapper">
            <div id="canvas" class="pixel-canvas">
                </div>
        </div>

        <div class="output-area">
            <label>Blockly Index-Liste:</label>
            <div class="copy-wrapper">
                <input type="text" id="output-string" readonly placeholder="0, 1, 2, ...">
                <button class="btn" onclick="copyToClipboard()">Kopieren</button>
            </div>
        </div>
    </main>
</div>

<footer>
    <div class="footer-links">
        <a href="../impressum.html">Impressum</a>
        <a href="../kontakt.html">Sende Nachricht</a>
        <a href="../datenschutz.html">Datenschutz</a>
    </div>
    <p>Ein Projekt von Ronnie Berzins. Copyright &copy; 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
